<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abismo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>To-do List</h1>
        <button id="toggle-theme"> 🌞 </button>

        <section class="input-container">
            <input type="text" id="task-input" placeholder="Ovo Rançoso">
            <button id="add-task">ADICIONAR</button>
        </section>

        <section class="filters">
            <button data-filter="all" class="filter active">TODAS</button>
            <button data-filter="pending" class="filter">PENDENTES</button>
            <button data-filter="completed" class="filter">CONCLÚIDAS</button>
        </section>

        <ul id="task-list"></ul>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
